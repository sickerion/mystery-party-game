<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="64" fill="#1a1a2e"/>
  
  <!-- Magnifying glass handle -->
  <rect x="72" y="72" width="8" height="32" fill="#d4af37" transform="rotate(45 76 88)"/>
  
  <!-- Magnifying glass circle rim -->
  <circle cx="52" cy="52" r="28" fill="none" stroke="#d4af37" stroke-width="6"/>
  
  <!-- Magnifying glass inner circle -->
  <circle cx="52" cy="52" r="22" fill="#16213e"/>
  
  <!-- Question mark -->
  <text x="52" y="62" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#d4af37" text-anchor="middle">?</text>
  
  <!-- Mystery accent dots -->
  <circle cx="20" cy="20" r="3" fill="#8b0000" opacity="0.6"/>
  <circle cx="108" cy="20" r="3" fill="#9b59b6" opacity="0.6"/>
  <circle cx="108" cy="108" r="3" fill="#8b0000" opacity="0.6"/>
</svg>